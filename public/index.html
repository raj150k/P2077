<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>P2077 VIP License Manager</title>
    <!-- Three.js Library for 3D Animation -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background-color: #030305; color: #fff; overflow: hidden; height: 100vh; display: flex; justify-content: center; align-items: center; }
        
        #canvas3d { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
        
        .glass-card { 
            position: relative; z-index: 2; 
            background: rgba(10, 10, 18, 0.65); 
            backdrop-filter: blur(20px); 
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(0, 242, 254, 0.2); 
            border-radius: 20px; 
            padding: 35px 30px; 
            width: 90%; max-width: 440px; 
            box-shadow: 0 0 40px rgba(0, 242, 254, 0.15), inset 0 0 15px rgba(0, 242, 254, 0.05); 
            text-align: center; 
        }

        h2 { 
            font-size: 1.9rem; margin-bottom: 5px; 
            background: linear-gradient(45deg, #00f2fe, #4facfe, #00ff88); 
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; 
            text-transform: uppercase; letter-spacing: 2px;
        }

        p.subtitle { font-size: 0.85rem; color: #8a8a9e; margin-bottom: 25px; }

        .input-group { margin-bottom: 18px; text-align: left; }
        .input-group label { display: block; font-size: 0.75rem; color: #00f2fe; margin-bottom: 6px; letter-spacing: 1px; font-weight: bold; }
        
        .input-group select, .input-group input { 
            width: 100%; padding: 12px; 
            background: rgba(0, 0, 0, 0.6); 
            border: 1px solid rgba(0, 242, 254, 0.3); 
            border-radius: 10px; color: #fff; 
            font-size: 0.95rem; outline: none; transition: 0.3s; 
        }

        .input-group select option { background: #0a0a12; color: #fff; }

        .btn-generate { 
            width: 100%; padding: 14px; border: none; border-radius: 10px; 
            background: linear-gradient(45deg, #00f2fe, #4facfe); 
            color: #000; font-weight: bold; font-size: 1rem; cursor: pointer; 
            transition: 0.3s; box-shadow: 0 0 20px rgba(0, 242, 254, 0.4);
            display: flex; justify-content: center; align-items: center; gap: 8px;
            margin-top: 10px;
        }

        .btn-generate:hover { transform: translateY(-2px); box-shadow: 0 0 30px rgba(0, 242, 254, 0.8); }

        .result-box { 
            margin-top: 22px; background: rgba(0, 0, 0, 0.7); 
            border: 1px dashed #00ff88; padding: 12px 15px; 
            border-radius: 10px; display: flex; justify-content: space-between; align-items: center; 
        }

        .key-text { font-family: 'Courier New', monospace; font-size: 1.1rem; color: #00ff88; font-weight: bold; }
        .copy-btn { background: none; border: none; color: #aaa; cursor: pointer; font-size: 1.2rem; transition: 0.2s; }
        .copy-btn:hover { color: #00ff88; }

        #statusMsg { margin-top: 15px; font-size: 0.85rem; }
        .success { color: #00ff88; } .error { color: #ff4757; }
    </style>
</head>
<body>

    <!-- 3D Canvas Background -->
    <canvas id="canvas3d"></canvas>

    <!-- UI Panel -->
    <div class="glass-card">
        <h2>P2077 VIP KEY</h2>
        <p class="subtitle">License Key Management Portal</p>

        <!-- Duration Select (3, 7, 15, 30 Days) -->
        <div class="input-group">
            <label><i class="fa-regular fa-clock"></i> SELECT DURATION (মেয়াদ)</label>
            <select id="keyDuration">
                <option value="3">3 Days Validity</option>
                <option value="7">7 Days Validity</option>
                <option value="15">15 Days Validity</option>
                <option value="30">30 Days Validity</option>
            </select>
        </div>

        <!-- Max Activations Input -->
        <div class="input-group">
            <label><i class="fa-solid fa-mobile-screen"></i> MAX ACTIVATIONS (ডিভাইস সীমা)</label>
            <input type="number" id="maxActivations" value="1" min="1">
        </div>

        <button class="btn-generate" onclick="generateKey()">
            <i class="fa-solid fa-bolt"></i> Generate Key Now
        </button>

        <!-- Result Section -->
        <div class="result-box" id="resultBox" style="display: none;">
            <span class="key-text" id="generatedKey">----</span>
            <button class="copy-btn" onclick="copyKey()" title="Copy Key"><i class="fa-regular fa-copy"></i></button>
        </div>

        <p id="statusMsg"></p>
    </div>

    <script>
        async function generateKey() {
            const statusMsg = document.getElementById("statusMsg");
            const duration = document.getElementById("keyDuration").value;
            const maxAct = document.getElementById("maxActivations").value;
            
            statusMsg.className = ""; 
            statusMsg.innerText = "Processing request to Database...";
            
            try {
                const response = await fetch('/api/generate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ days: duration, maxActivations: maxAct })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    document.getElementById("generatedKey").innerText = data.key;
                    document.getElementById("resultBox").style.display = "flex";
                    statusMsg.className = "success"; 
                    statusMsg.innerText = `✓ Key created! Valid for ${data.days} Days.`;
                } else {
                    statusMsg.className = "error"; 
                    statusMsg.innerText = "Database Error: " + data.message;
                }
            } catch (err) {
                statusMsg.className = "error"; 
                statusMsg.innerText = "Connection Failed! Check internet.";
            }
        }

        function copyKey() {
            const key = document.getElementById("generatedKey").innerText;
            navigator.clipboard.writeText(key);
            alert("License Key Copied: " + key);
        }

        // --- Three.js Dynamic 3D Animation Code ---
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('canvas3d'), antialias: true });
        
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);

        // 3D Geometry (Glowing Cyber Sphere)
        const geometry = new THREE.IcosahedronGeometry(12, 2);
        const material = new THREE.MeshBasicMaterial({ color: 0x00f2fe, wireframe: true });
        const sphere = new THREE.Mesh(geometry, material);
        scene.add(sphere);

        // Background Floating Particles
        const particlesGeometry = new THREE.BufferGeometry();
        const particlesCount = 600;
        const posArray = new Float32Array(particlesCount * 3);

        for(let i=0; i < particlesCount*3; i++) {
            posArray[i] = (Math.random() - 0.5) * 80;
        }
        particlesGeometry.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
        const particlesMaterial = new THREE.PointsMaterial({ size: 0.12, color: 0x00ff88 });
        const particlesMesh = new THREE.Points(particlesGeometry, particlesMaterial);
        scene.add(particlesMesh);

        camera.position.z = 28;

        function animate() {
            requestAnimationFrame(animate);
            sphere.rotation.x += 0.003;
            sphere.rotation.y += 0.005;
            particlesMesh.rotation.y -= 0.001;
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
  </html>
