<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>P2077 Premium Admin</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        
        /* Premium Color Grading */
        body { background: radial-gradient(circle at center, #0a0a1a 0%, #020205 100%); color: #fff; overflow: hidden; height: 100vh; display: flex; justify-content: center; align-items: center; }
        #canvas3d { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none; }
        
        .glass-card { 
            position: relative; z-index: 2; background: rgba(15, 10, 30, 0.5); 
            backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(0, 242, 254, 0.2); border-radius: 25px; 
            padding: 35px; width: 95%; max-width: 800px; 
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), inset 0 0 20px rgba(0, 242, 254, 0.1); 
            text-align: center; transition: 0.5s all ease-in-out;
        }

        /* Profile Section */
        .profile-container { margin-bottom: 25px; animation: fadeIn 1s ease-in-out; }
        .profile-img { width: 110px; height: 110px; border-radius: 50%; object-fit: cover; border: 3px solid #00f2fe; box-shadow: 0 0 25px rgba(0, 242, 254, 0.6); margin-bottom: 15px; padding: 3px; }
        .profile-name { font-size: 1.6rem; color: #fff; font-weight: bold; text-shadow: 0 0 15px rgba(0, 242, 254, 0.8); letter-spacing: 1px; }
        .profile-tg { color: #00ff88; font-size: 0.95rem; text-decoration: none; text-shadow: 0 0 10px rgba(0, 255, 136, 0.5); }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }

        /* Login Inputs */
        #login-section { max-width: 380px; margin: 0 auto; }
        #login-section input { width: 100%; padding: 14px; margin: 12px 0; background: rgba(0,0,0,0.6); border: 1px solid rgba(0, 242, 254, 0.4); color: #fff; border-radius: 12px; text-align: center; font-size: 1.05rem; outline: none; transition: 0.3s; }
        #login-section input:focus { box-shadow: 0 0 20px rgba(0, 242, 254, 0.6); border-color: #00f2fe; transform: scale(1.02); }

        /* Buttons with Premium Glow */
        .btn-primary { width: 100%; padding: 14px; border: none; border-radius: 12px; background: linear-gradient(45deg, #00f2fe, #4facfe); color: #000; font-weight: bold; font-size: 1.1rem; cursor: pointer; transition: 0.3s; margin-top: 15px; box-shadow: 0 0 15px rgba(0, 242, 254, 0.4); }
        .btn-primary:hover { box-shadow: 0 0 30px rgba(0, 242, 254, 0.8); transform: translateY(-3px); }
        .btn-primary:active { box-shadow: 0 0 40px #00f2fe, inset 0 0 10px rgba(0,0,0,0.5); transform: scale(0.95); }

        /* Main App */
        #main-app { display: none; }
        h2.panel-title { font-size: 1.8rem; background: linear-gradient(45deg, #00f2fe, #00ff88); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-transform: uppercase; margin-bottom: 20px; }

        /* Tabs */
        .tabs { display: flex; justify-content: center; gap: 20px; margin-bottom: 25px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 15px; }
        .tab-btn { background: none; border: none; color: #7a7a9e; font-size: 1.1rem; cursor: pointer; transition: 0.3s; font-weight: bold; padding: 10px 20px; border-radius: 10px; }
        .tab-btn.active { color: #fff; background: rgba(0, 242, 254, 0.1); box-shadow: 0 0 20px rgba(0, 242, 254, 0.3); border: 1px solid rgba(0, 242, 254, 0.5); }

        /* Inputs */
        .input-group { margin-bottom: 18px; text-align: left; }
        .input-group label { display: block; font-size: 0.85rem; color: #00f2fe; margin-bottom: 8px; font-weight: bold; letter-spacing: 1px; }
        .input-group select, .input-group input { width: 100%; padding: 12px; background: rgba(0, 0, 0, 0.6); border: 1px solid rgba(0, 242, 254, 0.3); border-radius: 10px; color: #fff; outline: none; transition: 0.3s; }
        .input-group select:focus, .input-group input:focus { box-shadow: 0 0 15px rgba(0, 242, 254, 0.4); border-color: #00f2fe; }

        /* Dashboard Table */
        .dashboard-content { display: none; }
        .stats { display: flex; justify-content: space-between; margin-bottom: 15px; font-size: 1rem; color: #00ff88; font-weight: bold; }
        .table-container { max-height: 350px; overflow-y: auto; text-align: left; border-radius: 15px; background: rgba(0,0,0,0.5); border: 1px solid rgba(0, 242, 254, 0.2); }
        table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
        th, td { padding: 15px; border-bottom: 1px solid rgba(255,255,255,0.05); }
        th { background: rgba(0, 242, 254, 0.15); color: #00f2fe; position: sticky; top: 0; backdrop-filter: blur(10px); }
        .status-active { color: #00ff88; font-weight: bold; text-shadow: 0 0 10px rgba(0,255,136,0.4); }
        
        .btn-delete { background: rgba(255, 71, 87, 0.1); color: #ff4757; border: 1px solid #ff4757; padding: 8px 12px; border-radius: 8px; cursor: pointer; transition: 0.3s; font-weight: bold; }
        .btn-delete:hover { background: #ff4757; color: #fff; box-shadow: 0 0 20px #ff4757; transform: scale(1.1); }
        .btn-delete:active { transform: scale(0.9); }

        /* Result Box */
        .result-box { margin-top: 20px; background: rgba(0, 255, 136, 0.1); border: 1px dashed #00ff88; padding: 15px; border-radius: 12px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 0 20px rgba(0,255,136,0.2); }
        .key-text { font-family: 'Courier New', monospace; color: #00ff88; font-size: 1.3rem; font-weight: bold; letter-spacing: 2px; }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #00f2fe; border-radius: 10px; }
    </style>
</head>
<body>
    <canvas id="canvas3d"></canvas>

    <div class="glass-card">
        <!-- LOGIN SECTION -->
        <div id="login-section">
            <div class="profile-container">
                <!-- Profile Image points to profile.jpg -->
                <img src="profile.jpg" alt="Profile" class="profile-img" onerror="this.src='https://i.imgur.com/8QG4FqQ.jpg'">
                <div class="profile-name">RA J</div>
                <a href="https://t.me/raj150k" target="_blank" class="profile-tg"><i class="fa-brands fa-telegram"></i> @raj150k</a>
            </div>
            
            <input type="text" id="adminUser" placeholder="Username (raj150k)">
            <input type="password" id="adminPass" placeholder="Password">
            <button class="btn-primary" onclick="checkLogin()">LOGIN SECURELY</button>
            <p id="loginError" style="color:#ff4757; margin-top:15px; font-size: 0.9rem; font-weight:bold;"></p>
        </div>

        <!-- MAIN APP -->
        <div id="main-app">
            <h2 class="panel-title"><i class="fa-solid fa-shield-halved"></i> VIP SYSTEM</h2>
            
            <div class="tabs">
                <button class="tab-btn active" onclick="switchTab('generator')"><i class="fa-solid fa-bolt"></i> Generate</button>
                <button class="tab-btn" onclick="switchTab('dashboard')"><i class="fa-solid fa-server"></i> Dashboard</button>
            </div>

            <!-- GENERATOR TAB -->
            <div id="tab-generator">
                <div class="input-group">
                    <label>SELECT DURATION</label>
                    <select id="keyDuration">
                        <option value="3">3 Days Premium</option>
                        <option value="7">7 Days Premium</option>
                        <option value="15">15 Days Premium</option>
                        <option value="30">30 Days VIP</option>
                    </select>
                </div>
                <div class="input-group">
                    <label>DEVICE LIMIT</label>
                    <input type="number" id="maxActivations" value="1" min="1">
                </div>
                <button class="btn-primary" onclick="generateKey()"><i class="fa-solid fa-microchip"></i> CREATE VIP KEY</button>
                
                <div class="result-box" id="resultBox" style="display: none;">
                    <span class="key-text" id="generatedKey">----</span>
                    <button class="btn-primary" style="width:auto; margin:0; padding:10px 15px;" onclick="copyKey()"><i class="fa-regular fa-copy"></i> Copy</button>
                </div>
                <p id="statusMsg" style="margin-top:15px; font-size:0.95rem; font-weight:bold;"></p>
            </div>

            <!-- DASHBOARD TAB -->
            <div id="tab-dashboard" class="dashboard-content">
                <div class="stats">
                    <span><i class="fa-solid fa-database"></i> Total Keys: <strong id="totalKeys">0</strong></span>
                    <button style="background:rgba(0,242,254,0.1);border:1px solid #00f2fe;color:#00f2fe;cursor:pointer;padding:5px 10px;border-radius:5px;" onclick="loadDashboard()">Refresh <i class="fa-solid fa-rotate-right"></i></button>
                </div>
                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>Key</th>
                                <th>Generated On</th>
                                <th>Expires On</th>
                                <th>Status</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody id="keysTableBody"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        // --- 1. Login System ---
        function checkLogin() {
            const user = document.getElementById("adminUser").value;
            const pass = document.getElementById("adminPass").value;
            
            if(user === "raj150k" && pass === "Raj123@") {
                document.getElementById("login-section").style.display = "none";
                document.getElementById("main-app").style.display = "block";
                document.querySelector('.glass-card').style.maxWidth = "900px"; 
                loadDashboard(); 
            } else {
                document.getElementById("loginError").innerText = "Invalid Credentials!";
                document.getElementById("adminUser").style.borderColor = "#ff4757";
                document.getElementById("adminPass").style.borderColor = "#ff4757";
            }
        }

        function switchTab(tabName) {
            document.getElementById("tab-generator").style.display = tabName === 'generator' ? 'block' : 'none';
            document.getElementById("tab-dashboard").style.display = tabName === 'dashboard' ? 'block' : 'none';
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            event.currentTarget.classList.add('active');
            if(tabName === 'dashboard') loadDashboard();
        }

        function formatDate(dateString) {
            if(!dateString) return "Unlimited";
            const options = { year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit', hour12: true };
            return new Date(dateString).toLocaleDateString('en-US', options);
        }

        async function loadDashboard() {
            const tbody = document.getElementById("keysTableBody");
            tbody.innerHTML = "<tr><td colspan='5' style='text-align:center;'><i class='fa-solid fa-spinner fa-spin'></i> Fetching...</td></tr>";
            
            try {
                const res = await fetch('/api/keys');
                const data = await res.json();
                
                if(data.success && Array.isArray(data.keys) && data.keys.length > 0) {
                    document.getElementById("totalKeys").innerText = data.keys.length;
                    tbody.innerHTML = "";
                    
                    data.keys.forEach(row => {
                        tbody.innerHTML += `
                            <tr>
                                <td style="font-family:monospace; color:#00f2fe; letter-spacing:1px;">${row.license_key}</td>
                                <td style="color:#aaa;">${formatDate(row.created_at)}</td>
                                <td style="color:#ffcc00;">${formatDate(row.expires_at)}</td>
                                <td class="status-active"><i class="fa-solid fa-circle-check"></i> ${row.status.toUpperCase()}</td>
                                <td><button class="btn-delete" onclick="deleteKey('${row.license_key}')"><i class="fa-solid fa-trash-can"></i></button></td>
                            </tr>
                        `;
                    });
                } else {
                    tbody.innerHTML = "<tr><td colspan='5' style='text-align:center;color:#ffcc00;'>No keys generated yet.</td></tr>";
                    document.getElementById("totalKeys").innerText = "0";
                }
            } catch(e) {
                tbody.innerHTML = "<tr><td colspan='5' style='text-align:center; color:#ff4757;'>Error loading database!</td></tr>";
            }
        }

        async function generateKey() {
            const statusMsg = document.getElementById("statusMsg");
            statusMsg.style.color = "#00f2fe"; statusMsg.innerHTML = "<i class='fa-solid fa-spinner fa-spin'></i> Creating VIP Key...";
            
            try {
                const res = await fetch('/api/generate', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ days: document.getElementById("keyDuration").value, maxActivations: document.getElementById("maxActivations").value })
                });
                const data = await res.json();
                if(data.success) {
                    document.getElementById("generatedKey").innerText = data.key;
                    document.getElementById("resultBox").style.display = "flex";
                    statusMsg.style.color = "#00ff88"; statusMsg.innerText = "✓ Key Generated Successfully!";
                    loadDashboard(); 
                } else {
                    statusMsg.style.color = "#ff4757"; statusMsg.innerText = "Generation Failed!";
                }
            } catch(e) {
                statusMsg.style.color = "#ff4757"; statusMsg.innerText = "Network Error!";
            }
        }

        async function deleteKey(key) {
            if(confirm("DELETE PERMANENTLY: " + key + " ?")) {
                try {
                    await fetch('/api/keys/' + key, { method: 'DELETE' });
                    loadDashboard(); 
                } catch(e) { alert("Delete Error!"); }
            }
        }

        function copyKey() {
            navigator.clipboard.writeText(document.getElementById("generatedKey").innerText);
            alert("✓ Key Copied to Clipboard!");
        }

        // --- Multi-color Premium 3D Particles ---
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('canvas3d'), alpha: true, antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        
        // Background Sphere
        const geometry = new THREE.IcosahedronGeometry(14, 2);
        const material = new THREE.MeshBasicMaterial({ color: 0x002244, wireframe: true, transparent: true, opacity: 0.3 });
        const sphere = new THREE.Mesh(geometry, material);
        scene.add(sphere);

        // Multi-color glowing particles
        const particlesCount = 800;
        const posArray = new Float32Array(particlesCount * 3);
        const colorsArray = new Float32Array(particlesCount * 3);
        const color = new THREE.Color();

        for(let i=0; i < particlesCount*3; i+=3) {
            posArray[i] = (Math.random() - 0.5) * 100;
            posArray[i+1] = (Math.random() - 0.5) * 100;
            posArray[i+2] = (Math.random() - 0.5) * 100;

            // Generate random Cyan, Purple, Pink colors
            color.setHSL(Math.random() * 0.3 + 0.5, 1.0, 0.6); 
            colorsArray[i] = color.r;
            colorsArray[i+1] = color.g;
            colorsArray[i+2] = color.b;
        }

        const particlesGeometry = new THREE.BufferGeometry();
        particlesGeometry.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
        particlesGeometry.setAttribute('color', new THREE.BufferAttribute(colorsArray, 3));
        
        const particlesMaterial = new THREE.PointsMaterial({ size: 0.25, vertexColors: true, transparent: true, opacity: 0.8 });
        const particlesMesh = new THREE.Points(particlesGeometry, particlesMaterial);
        scene.add(particlesMesh);

        camera.position.z = 30;

        let mouseX = 0, mouseY = 0;
        document.addEventListener('mousemove', (e) => {
            mouseX = (e.clientX - window.innerWidth / 2) * 0.001;
            mouseY = (e.clientY - window.innerHeight / 2) * 0.001;
        });

        function animate() {
            requestAnimationFrame(animate);
            sphere.rotation.x += 0.002; sphere.rotation.y += 0.003;
            particlesMesh.rotation.y -= 0.001;
            particlesMesh.rotation.x -= 0.0005;
            
            camera.position.x += (mouseX * 10 - camera.position.x) * 0.05;
            camera.position.y += (-mouseY * 10 - camera.position.y) * 0.05;
            camera.lookAt(scene.position);

            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
                        </html>
